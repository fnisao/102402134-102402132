<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a7477">
  <title>拾光校园｜校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-shell">
    <aside class="brand-panel" aria-label="项目介绍">
      <div class="brand-top"><span class="brand-mark">拾</span><span>拾光校园 <small>LOST & FOUND</small></span></div>
      <div class="brand-story"><p class="eyebrow">把线索，交还给校园</p><h1>让走失的物品<br><em>找到回家的路。</em></h1><p>一处发布，一处寻找。让每一次拾起和寻回，都有清晰的下一步。</p></div>
      <div class="brand-illustration" aria-hidden="true"><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span><span class="illustration-card card-one">⌕<small>发现线索</small></span><span class="illustration-card card-two">✦<small>重新相遇</small></span></div>
      <p class="brand-foot">拾光校园 · 校园失物招领</p>
    </aside>
    <main class="workspace">
      <header class="topbar"><div><span class="topbar-dot"></span>校园失物招领 <span class="topbar-sub">/ 校园互助站</span></div><span class="today" id="today"></span></header>
      <div id="app" aria-live="polite"></div>
      <nav class="bottom-nav" aria-label="主导航">
        <button type="button" data-nav="home"><span>⌂</span>首页</button>
        <button type="button" data-nav="search"><span>⌕</span>搜索</button>
        <button type="button" data-nav="publish"><span>＋</span>发布</button>
        <button type="button" data-nav="mine"><span>▤</span>我的</button>
      </nav>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/logic.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
