<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a7477">
  <title>拾光校园｜校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-shell">
    <aside class="brand-panel" aria-label="项目介绍">
      <div class="brand-top"><span class="brand-mark">拾</span><span>拾光校园 <small>LOST & FOUND</small></span></div>
      <div class="brand-story"><p class="eyebrow">把线索，交还给校园</p><h1>让走失的物品<br><em>找到回家的路。</em></h1><p>一处发布，一处寻找。让每一次拾起和寻回，都有清晰的下一步。</p></div>
      <div class="brand-illustration" aria-hidden="true"><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span><span class="illustration-card card-one">⌕<small>发现线索</small></span><span class="illustration-card card-two">✦<small>重新相遇</small></span></div>
      <p class="brand-foot">拾光校园 · 校园失物招领</p>
    </aside>
    <main class="workspace">
      <header class="topbar"><div><span class="topbar-dot"></span>校园失物招领 <span class="topbar-sub">/ 校园互助站</span></div><span class="today" id="today"></span></header>
      <div id="app" aria-live="polite"></div>
      <nav class="bottom-nav" aria-label="主导航">
        <button type="button" data-nav="home"><span>⌂</span>首页</button>
        <button type="button" data-nav="search"><span>⌕</span>搜索</button>
        <button type="button" data-nav="publish"><span>＋</span>发布</button>
        <button type="button" data-nav="mine"><span>▤</span>我的</button>
      </nav>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/logic.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const app = document.getElementById('app');
  // 监听页面内容变化，搜索页出现时自动插入筛选框
  const observer = new MutationObserver(() => {
    // 匹配搜索输入框
    const searchInput = document.querySelector('input[placeholder*="搜索"], .search-input');
    if (searchInput && !document.getElementById('statusFilter')) {
      // 插入状态筛选下拉框
      const filterBox = document.createElement('div');
      filterBox.style.cssText = 'padding: 8px 16px;';
      filterBox.innerHTML = `
        <label for="statusFilter" style="margin-right: 6px;">状态：</label>
        <select id="statusFilter" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ddd;">
          <option value="all">全部</option>
          <option value="active">进行中</option>
          <option value="done">已完成</option>
        </select>
      `;
      searchInput.parentNode.insertBefore(filterBox, searchInput.nextSibling);

      // 绑定筛选事件：切换状态 / 输入关键词 都触发筛选
      document.getElementById('statusFilter').addEventListener('change', runFilter);
      searchInput.addEventListener('input', runFilter);
    }
  });

  observer.observe(app, { childList: true, subtree: true });

  // 执行筛选逻辑
  function runFilter() {
    const keyword = document.querySelector('input[placeholder*="搜索"], .search-input')?.value.trim() || '';
    const status = document.getElementById('statusFilter')?.value || 'all';
    const listWrap = document.querySelector('.post-list, .list-wrap, .items'); // 列表容器类名

    if (!window.DEMO_POSTS || !listWrap) return;

    // 按「关键词 + 状态」双重过滤
    const result = window.DEMO_POSTS.filter(item => {
      const matchKeyword = 
        item.title.includes(keyword) ||
        item.location.includes(keyword) ||
        item.category.includes(keyword) ||
        item.description.includes(keyword);
      const matchStatus = status === 'all' || item.status === status;
      return matchKeyword && matchStatus;
    });

    // 调用原项目的渲染函数刷新列表
    // 如果原项目有 renderPosts / renderList 这类函数，直接调用；没有就用下面的简易渲染
    if (typeof renderPostList === 'function') {
      renderPostList(result);
    } else {
      // 简易渲染（兜底用，建议优先用原项目渲染函数）
      listWrap.innerHTML = '';
      result.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <h3>${post.title}</h3>
          <p>📍 ${post.location} · 📅 ${post.occurredAt}</p>
          <p>${post.description}</p>
          <span style="color:${post.status === 'active' ? '#2e7d32' : '#9e9e9e'}">
            ${post.status === 'active' ? '进行中' : '已完成'}
          </span>
        `;
        listWrap.appendChild(card);
      });
    }
  }
});
</script>
</body>
</html>
